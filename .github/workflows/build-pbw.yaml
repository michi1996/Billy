name: Build Pebble app

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-pbw.yaml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/build-pbw.yaml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The tests have no dependencies, so no npm install is needed.
      - name: npm test
        run: cd app && npm test

  build:
    runs-on: ubuntu-24.04
    env:
      PEBBLE_TOOL_VERSION: 5.0.40
      PEBBLE_SDK_VERSION: 4.33.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set short git commit SHA
        run: echo "COMMIT_SHORT_SHA=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pebble-tool
        run: |
          pip install "pebble-tool==${PEBBLE_TOOL_VERSION}"
          mkdir -p ~/.pebble-sdk && touch ~/.pebble-sdk/NO_TRACKING
      - name: Install Pebble SDK
        run: yes | pebble sdk install "${PEBBLE_SDK_VERSION}"
      - name: pebble build
        run: cd app && yes | pebble build
      - name: rename-app
        run: cp app/build/app.pbw Benny-g${{ env.COMMIT_SHORT_SHA }}.pbw
      - name: generate elf bundle
        run: mkdir elfs && cp app/build/emery/pebble-app.elf elfs/pebble-app-emery.elf && zip -r elfs.zip elfs
      - name: Upload PBW
        uses: actions/upload-artifact@v4
        with:
          name: Benny PBW
          path: Benny-g${{ env.COMMIT_SHORT_SHA }}.pbw
          if-no-files-found: error
      - name: Upload ELFs
        uses: actions/upload-artifact@v4
        with:
          name: Debug ELFs
          path: elfs.zip
